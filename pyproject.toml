[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftai"
version = "0.5.0"
description = "Probabilistic draft assistant for Sleeper Lock-In fantasy basketball"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "pyarrow>=14",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pydantic>=2.6",
    "pandera[polars]>=0.20",
    "httpx>=0.27",
    "nba_api>=1.4",
    "pyyaml>=6",
    "streamlit>=1.37",
    "plotly>=5.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
draftai = "draftai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (excluded by default in CI with -m 'not slow')",
    "network: tests that call external APIs",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
