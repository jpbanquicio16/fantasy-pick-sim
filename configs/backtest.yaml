# Draft backtest (draftai backtest). Seasons are start years: 2025 = 2025-26.
seasons: [2021, 2022, 2023, 2024, 2025]
strategies: [adp, points, vor, greedy_survival, rollout, oracle]
leagues: 96              # simulated leagues per season; your seat rotates through every slot
expensive_leagues: 24    # the first N leagues also run greedy_survival and rollout
schedules: 40            # random head-to-head schedules averaged per league
waiver_claims: 2         # free agents a team may claim per week to fill empty starting slots
rollout_worlds: 300      # smaller than live (600) to keep the backtest to minutes
rollout_shortlist: 6
rollout_race_after: 150
game_samples: 2000
seed: 5
jobs: 5                  # seasons run in parallel processes
replay_schedules: 200    # schedules per real-draft replay
room: calibrated         # simulated opponents: calibrated (tight to the market) or fitted (your real drafts)
