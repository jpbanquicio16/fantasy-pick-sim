ingest_seasons: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
first_target_season: 2016     # 2016-17; earlier seasons only supply lagged features
validation_seasons: [2021, 2022, 2023, 2024]
test_season: 2025             # touched once, after every choice is frozen
target_season: 2026           # the season being drafted
recency_half_life_seasons: 4.0
seed: 7
ridge_alpha: 10.0
quantiles: [0.1, 0.5, 0.9]
lgbm:
  n_estimators: 400
  learning_rate: 0.03
  num_leaves: 15
  max_depth: 4
  min_child_samples: 40
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  verbose: -1
# V5
rate_prior: hierarchical      # per-minute rate prior: hierarchical | bucket | hierarchical_scaled (rates-experiment)
rookie_model: model           # rookies: model (ridge + comparables) | baseline (draft slot)
rookie_k: 20                  # comparables per rookie
rookie_alpha: 10.0
